[project]
name = "funquiz"
version = "0.0.1"
description = "farfarfun 预留的测验工具包占位版本，当前仅提供包元数据"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Homepage = "https://pypi.org/project/funquiz/"
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funquiz"
Releases = "https://github.com/farfarfun/funquiz/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funquiz"]

[dependency-groups]
dev = ["pytest>=8.0"]
